name: Deploy to Streamlit Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Generate sample data
      run: |
        python scripts/generate_sample_data.py
    
    - name: Run tests
      run: |
        pytest tests/ -v
    
    - name: Deployment notification
      run: |
        echo "✅ Tests passed! Ready for Streamlit Cloud deployment"
        echo "🚀 Streamlit Cloud will auto-deploy from main branch"

# Note: Streamlit Cloud automatically deploys from GitHub
# This workflow just validates the code before deployment
